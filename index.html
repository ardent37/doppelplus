<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#232323">
  <title>Doppel+ Lens</title>

  <link rel="manifest" href="manifest.json">

  <style>
    /* Declaración de tu fuente personalizada */
    @font-face {
      font-family: 'Garet';
      src: url('Garet.woff2') format('woff2'),
           url('Garet.woff') format('woff'),
           url('Garet.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #262626; /* Color de fondo según tu mockup */
      --text: #ffffff;
      --text-muted: #a3a3a3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Garet', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 40px 24px;
    }

    /* Cabecera / Logo */
    header {
      margin-bottom: 50px;
    }
    
    header img {
      height: 32px;
      width: auto;
      object-fit: contain;
    }

    main {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Caja de subida de imagen */
    .upload-box {
      border: 3px dashed #ffffff;
      border-radius: 20px;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .upload-box:active {
      opacity: 0.7;
    }

    .upload-box svg {
      width: 54px;
      height: 54px;
      fill: #ffffff;
      margin-bottom: 16px;
    }

    .upload-box h2 {
      font-size: 1.5rem;
      font-weight: normal;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    .upload-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Botón RGB de Spreadsheets */
    .rgb-btn-wrapper {
      position: relative;
      border-radius: 14px;
      padding: 4px; /* Grosor del borde RGB */
      background: linear-gradient(90deg, #74ff5e, #3da9ff);
      text-decoration: none;
      display: block;
      transition: transform 0.15s ease;
    }

    .rgb-btn-wrapper:active {
      transform: scale(0.98);
    }

    .rgb-btn-inner {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .rgb-btn-inner img {
      max-height: 28px;
      width: auto;
    }

    /* Instrucciones iOS */
    .ios-guide {
      display: none; /* Oculto por defecto */
      margin-top: 20px;
      width: 100%;
    }

    .ios-guide h3 {
      font-size: 1.1rem;
      font-weight: normal;
      margin-bottom: 16px;
    }

    .ios-guide ol {
      list-style: none;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 2.2;
    }

    .ios-guide li {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      width: 24px;
      height: 24px;
      margin: 0 4px;
    }
    
    .icon-square {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      width: 24px;
      height: 24px;
      margin: 0 4px;
    }

    .ios-guide svg {
      width: 14px;
      height: 14px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }

    /* Botón Android */
    .android-btn {
      display: none; /* Oculto por defecto */
      margin-top: 20px;
      width: 100%;
      background-color: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.1rem;
      padding: 16px;
      text-align: center;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .android-btn:active {
      background-color: rgba(255, 255, 255, 0.12);
    }

    .android-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--text);
      fill: none;
      stroke-width: 2;
    }

    /* Estado de Carga (Spinner) */
    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg);
      z-index: 99;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Cabecera con tu imagen de logo -->
  <header>
    <img src="logo.png" alt="doppel+">
  </header>

  <main id="mainContent">
    
    <!-- Input invisible unificado (Cámara/Galería) -->
    <!-- Al no poner capture="environment", el móvil preguntará si usar cámara o galería -->
    <input type="file" id="imageInput" accept="image/*" hidden>

    <!-- Caja Punteada -->
    <label for="imageInput" class="upload-box">
      <!-- Icono de cámara -->
      <svg viewBox="0 0 24 24">
        <path d="M4 8V6a2 2 0 0 1 2-2h2.518a2 2 0 0 0 1.638-.86l.87-1.26a2 2 0 0 1 1.639-.88h4.67a2 2 0 0 1 1.64.88l.87 1.26a2 2 0 0 0 1.637.86H24a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8zm10 10a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-2a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/>
      </svg>
      <h2>Subir imagen</h2>
      <p>Encuentra cualquier producto<br>en el mercado chino</p>
    </label>

    <!-- Botón RGB Spreadsheets -->
    <a href="AQUÍ_VA_LA_URL_A_TUS_SPREADSHEETS" class="rgb-btn-wrapper">
      <div class="rgb-btn-inner">
        <!-- Reemplaza el src con la imagen exacta de tu botón de spreadsheets -->
        <img src="spreadsheet-btn.png" alt="verified spreadsheets.">
      </div>
    </a>

    <!-- INSTRUCCIONES iOS (Se mostrará solo en iPhone Safari no instalado) -->
    <div id="iosInstallSection" class="ios-guide">
      <h3>Cómo instalar app:</h3>
      <ol>
        <li>1. Pulsa <span class="icon-circle"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="2" fill="currentColor" stroke="none"/></svg></span></li>
        <li>2. Selecciona "Compartir" <span class="icon-square"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8.5 6.5M12 3l3.5 3.5M4 12v6a2 2 0 002 2h12a2 2 0 002-2v-6"/></svg></span></li>
        <li>3. Despliega "Ver más" <span class="icon-circle"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></li>
        <li>4. Selecciona "Añadir a pantalla de inicio" <span class="icon-square"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></li>
      </ol>
    </div>

    <!-- BOTÓN ANDROID (Se mostrará solo en Android no instalado) -->
    <button id="androidInstallBtn" class="android-btn">
      Instalar app
      <span class="icon-square">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </span>
    </button>

  </main>

  <!-- Pantalla de carga mientras se procesa la foto -->
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <h2 style="font-weight: normal; margin-bottom: 8px;">Procesando...</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Conectando con Doppel</p>
  </div>

  <script>
    // Configuración API Doppel
    const IMGBB_API_KEY = "120d2c073cc31bae07fe792b613cf048";
    
    // Elementos del DOM
    const imageInput = document.getElementById('imageInput');
    const mainContent = document.getElementById('mainContent');
    const loadingState = document.getElementById('loadingState');
    
    // LÓGICA DE SUBIDA Y REDIRECCIÓN
    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      mainContent.style.display = 'none';
      loadingState.style.display = 'flex';

      try {
        const formData = new FormData();
        formData.append('image', file);

        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!data.success) {
          throw new Error("Error al subir la imagen");
        }

        const uploadedUrl = data.data.url;
        window.location.href = `https://doppel.fit/s/image?imageUrl=${encodeURIComponent(uploadedUrl)}`;

      } catch (err) {
        console.error(err);
        alert("Hubo un fallo al subir la fotografía. Inténtalo de nuevo.");
        loadingState.style.display = 'none';
        mainContent.style.display = 'flex';
      } finally {
        imageInput.value = '';
      }
    });

    // LÓGICA DEL BOTÓN "ATRÁS" (Bfcache)
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        loadingState.style.display = 'none';
        mainContent.style.display = 'flex';
        imageInput.value = '';
      }
    });

    // ==========================================
    // LÓGICA INTELIGENTE DE INSTALACIÓN (PWA)
    // ==========================================
    
    // 1. Detectar si ya está instalada como App
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    
    // 2. Detectar si es un dispositivo iOS
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (!isStandalone) {
      if (isIOS) {
        // Muestra las instrucciones de texto para iPhone
        document.getElementById('iosInstallSection').style.display = 'block';
      } else {
        // En Android (Chrome), interceptamos el evento de instalación nativo
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          
          const installBtn = document.getElementById('androidInstallBtn');
          installBtn.style.display = 'flex'; // Mostramos el botón Android

          installBtn.addEventListener('click', async () => {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
              installBtn.style.display = 'none';
            }
            deferredPrompt = null;
          });
        });
      }
    }

    // Registrar Service Worker para permitir la instalación
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Error SW:', err));
    }
  </script>
</body>
</html>
