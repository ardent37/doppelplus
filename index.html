<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#09090b">
  <title>Doppel+ Lens</title>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --bg: #09090b;
      --card: #121215;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top, 8px);
    }

    .brand {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand span {
      color: #3b82f6;
    }

    .badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 0;
    }

    .lens-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .lens-preview svg {
      width: 44px;
      height: 44px;
      stroke: var(--text);
      stroke-width: 1.5;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      max-width: 280px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }

    .btn {
      width: 100%;
      height: 54px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000000;
    }

    .btn-secondary {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    
    .btn-spreadsheet {
      background-color: #1e1e24;
      color: #3b82f6;
      border: 1px solid #3b82f6;
    }

    .btn svg {
      width: 20px;
      height: 20px;
      stroke-width: 2;
    }

    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .loading-subtext {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .error-toast {
      display: none;
      margin-top: 18px;
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 0.85rem;
      max-width: 320px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      Doppel<span>+</span>
    </div>
    <span class="badge">Mobile Lens</span>
  </header>

  <main>
    <div id="idleState">
      <div class="lens-preview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <h1>Buscar por imagen</h1>
      <p class="subtitle">Fotografía cualquier artículo para localizarlo al instante en Doppel.</p>
    </div>

    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <div>
        <div class="loading-text" id="statusTitle">Subiendo fotografía...</div>
        <div class="loading-subtext" id="statusSubtitle">Procesando imagen</div>
      </div>
    </div>

    <div id="errorToast" class="error-toast"></div>
  </main>

  <div class="actions" id="actionButtons">
    <!-- Botones de captura -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    <button class="btn btn-primary" onclick="document.getElementById('cameraInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      Hacer foto
    </button>

    <input type="file" id="galleryInput" accept="image/*" hidden>
    <button class="btn btn-secondary" onclick="document.getElementById('galleryInput').click()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Elegir de la galería
    </button>

    <!-- Separador y Hub de Afiliados -->
    <div style="height: 1px; background: var(--border); margin: 12px 0;"></div>

    <a href="AQUÍ_VA_LA_URL_A_TUS_SPREADSHEETS" style="text-decoration: none;">
      <button class="btn btn-spreadsheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        Mis Spreadsheets Verificadas
      </button>
    </a>
    
    <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; text-align: center;">
      Usa el código <strong>SALTY</strong> en USFans.
    </p>
  </div>

  <script>
    const IMGBB_API_KEY = "120d2c073cc31bae07fe792b613cf048";

    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const idleState = document.getElementById('idleState');
    const loadingState = document.getElementById('loadingState');
    const actionButtons = document.getElementById('actionButtons');
    const statusTitle = document.getElementById('statusTitle');
    const statusSubtitle = document.getElementById('statusSubtitle');
    const errorToast = document.getElementById('errorToast');

    [cameraInput, galleryInput].forEach(input => {
      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        showLoading();

        try {
          statusTitle.textContent = "Subiendo imagen...";
          statusSubtitle.textContent = "Conectando con el servidor";

          const formData = new FormData();
          formData.append('image', file);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();

          if (!data.success) {
            throw new Error(data.error?.message || "Error al procesar la imagen");
          }

          const uploadedUrl = data.data.url;

          statusTitle.textContent = "Abriendo Doppel...";
          statusSubtitle.textContent = "Cargando resultados de búsqueda";

          window.location.href = `https://doppel.fit/s/image?imageUrl=${encodeURIComponent(uploadedUrl)}`;

        } catch (err) {
          console.error(err);
          showError("Hubo un fallo al subir la fotografía. Inténtalo de nuevo.");
        } finally {
          input.value = '';
        }
      });
    });

    function showLoading() {
      idleState.style.display = 'none';
      actionButtons.style.display = 'none';
      errorToast.style.display = 'none';
      loadingState.style.display = 'flex';
    }

    function showError(msg) {
      loadingState.style.display = 'none';
      idleState.style.display = 'block';
      actionButtons.style.display = 'flex';
      errorToast.textContent = msg;
      errorToast.style.display = 'block';
    }

    // Solución para el botón de Atrás (Bfcache)
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        loadingState.style.display = 'none';
        idleState.style.display = 'block';
        actionButtons.style.display = 'flex';
        cameraInput.value = '';
        galleryInput.value = '';
      }
    });

    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Error SW:', err));
    }
  </script>
</body>
</html>
